#Loggion config
logging.level.root=INFO
logging.file.name=logs/persona.log
#REST Config
server.port=3000
spring.application.name=PersonApp API
#Bean reference Config
spring.main.allow-circular-references=true
#SWAGGER (OpenAPI) Config
springdoc.api-docs.path=/api-docs
#MariaDB Config
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3307/persona_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:persona_db}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:persona_db}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
#MongoDB Config
spring.data.mongodb.authentication-database=${SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE:admin}
spring.data.mongodb.username=${SPRING_DATA_MONGODB_USERNAME:persona_db}
spring.data.mongodb.password=${SPRING_DATA_MONGODB_PASSWORD:persona_db}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:persona_db}
spring.data.mongodb.port=${SPRING_DATA_MONGODB_PORT:27017}
spring.data.mongodb.host=${SPRING_DATA_MONGODB_HOST:localhost}